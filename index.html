      { time:"15:00", name:"바이닐 레코드샵", cat:"쇼핑", note:"판을 넘기다 보면, 서로의 플레이리스트를 자연스레 알게 돼요.", walk:"도보 7분" },
      { time:"16:30", name:"인디 소극장 공연", cat:"공연", note:"작은 무대라서 더 가까이 느껴지고, 끝나고 나눌 이야기도 많아져요.", walk:"도보 5분" },
      { time:"18:00", name:"작업실 카페", cat:"카페", note:"무대의 여운이 채 가시기 전에, 나란히 앉아 이야기를 이어가는 곳.", walk:"" },
    ],
  },
  {
    id: "jamsil-indoor",
    title: "잠실 실내 데이트 코스",
    area: "잠실",
    desc: "날씨를 신경 쓰지 않아도 되는, 마음 편히 흘러가는 하루",
    moods: ["캐주얼", "조용한"],
    icon: "🎬", bgIcon: "🍿", grad: "linear-gradient(155deg,#E7EEF5,#9FC3DE 75%)",
    stops: [
      { time:"13:00", name:"대형 아쿠아리움", cat:"전시", note:"느린 걸음으로 둘러보다 보면, 대화도 자연스레 끊기지 않아요.", walk:"도보 8분" },
      { time:"15:30", name:"쇼핑몰 카페", cat:"카페", note:"날씨 걱정 없이, 마음 편히 앉아 쉬어가는 자리.", walk:"도보 5분" },
      { time:"17:30", name:"영화관", cat:"영화", note:"어떤 하루였든, 무난하게 마무리하기 좋은 선택.", walk:"" },
    ],
  },
];

const allMoods = [...new Set(courses.flatMap(c => c.moods))];
const allAreas = [...new Set(courses.map(c => c.area))];
let activeArea = "전체";
let activeMood = "전체";

function courseCardHTML(c) {
  return `
    <div class="course-card" data-id="${c.id}">
      <div class="cover" style="background:${c.grad}">
        <span class="bg-icon">${c.bgIcon || c.icon}</span>
        <span class="main-icon">${c.icon}</span>
        <span class="area-tag">${c.area}</span>
      </div>
      <div class="course-body">
        <h3>${c.title}</h3>
        <p class="desc">${c.desc}</p>
        <div class="moods">${c.moods.map(m => `<span class="mood-chip">${m}</span>`).join('')}</div>
      </div>
    </div>
  `;
}

function emptyState() {
  return '<p style="grid-column:1/-1;text-align:center;color:var(--ink-soft);padding:30px 0;">조건에 맞는 코스가 아직 없어요</p>';
}

function bindCardClicks(container) {
  container.querySelectorAll('.course-card').forEach(card => {
    card.addEventListener('click', () => showDetail(card.dataset.id));
  });
}

function renderFilters() {
  const areaEl = document.getElementById('areaFilters');
  const moodEl = document.getElementById('moodFilters');

  areaEl.innerHTML = ["전체", ...allAreas].map(a =>
    `<button class="filter-btn ${a===activeArea?'active area-active':''}" data-area="${a}">${a}</button>`
  ).join('');
  moodEl.innerHTML = ["전체", ...allMoods].map(m =>
    `<button class="filter-btn ${m===activeMood?'active':''}" data-mood="${m}">${m}</button>`
  ).join('');

  areaEl.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => { activeArea = btn.dataset.area; renderFilters(); renderGrids(); });
  });
  moodEl.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => { activeMood = btn.dataset.mood; renderFilters(); renderGrids(); });
  });
}

function renderGrids() {
  const areaGrid = document.getElementById('areaGrid');
  const areaList = activeArea === "전체" ? courses : courses.filter(c => c.area === activeArea);
  areaGrid.innerHTML = areaList.length ? areaList.map(courseCardHTML).join('') : emptyState();
  bindCardClicks(areaGrid);

  const moodGrid = document.getElementById('moodGrid');
  const moodList = activeMood === "전체" ? courses : courses.filter(c => c.moods.includes(activeMood));
  moodGrid.innerHTML = moodList.length ? moodList.map(courseCardHTML).join('') : emptyState();
  bindCardClicks(moodGrid);
}

function showDetail(id) {
  const c = courses.find(x => x.id === id);
  document.getElementById('detailCover').style.background = c.grad;
  document.getElementById('detailCover').innerHTML = `<span class="bg-icon">${c.bgIcon || c.icon}</span><span class="main-icon">${c.icon}</span>`;
  document.getElementById('detailTitle').textContent = c.title;
  document.getElementById('detailSub').textContent = c.area + " · " + c.desc;
  document.getElementById('detailMoods').innerHTML = c.moods.map(m => `<span class="mood-chip">${m}</span>`).join('');

  document.getElementById('timeline').innerHTML = c.stops.map((s, i) => `
    <div class="stop">
      <div class="stop-rail">
        <div class="stop-dot"></div>
        ${i < c.stops.length - 1 ? '<div class="stop-line"></div>' : ''}
      </div>
      <div class="stop-content">
        <div class="stop-time">${s.time}</div>
        <h4 class="stop-name">${s.name}</h4>
        <div class="stop-cat">${s.cat}</div>
        <div class="stop-note">${s.note}</div>
        ${s.walk ? `<div class="walk-note">🚶 ${s.walk} 이동</div>` : ''}
      </div>
    </div>
  `).join('');

  document.getElementById('view-list').style.display = 'none';
  document.getElementById('view-detail').style.display = 'block';
  window.scrollTo(0,0);
  location.hash = id;
}

document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('view-detail').style.display = 'none';
  document.getElementById('view-list').style.display = 'block';
  history.replaceState(null, '', location.pathname);
});

renderFilters();
renderGrids();

if (location.hash) {
  const id = location.hash.slice(1);
  if (courses.some(c => c.id === id)) showDetail(id);
}
</script>

</body>
</html>
